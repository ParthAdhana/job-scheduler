# Short intervals so tests that wait on background work finish quickly.
scheduler:
  instance-id: test
  outbox:
    poll-interval-ms: 50
  worker:
    concurrency:
      high: 2
      normal: 2
      low: 1
    lease-duration: 10s
  retry:
    base-delay: 100ms
    max-delay: 400ms
  poller:
    interval-ms: 100
    reaper-interval-ms: 300
  rate-limit:
    defaults:
      capacity: 100000
      refill-per-second: 100000
    tenants:
      limited-tenant:
        capacity: 3
        refill-per-second: 0.1
  concurrency-limits:
    sleep: 1
