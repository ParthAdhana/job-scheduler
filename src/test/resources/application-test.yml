# Short intervals so tests that wait on background work finish quickly.
scheduler:
  instance-id: test
  outbox:
    poll-interval-ms: 50
  worker:
    concurrency: 2
    lease-duration: 10s
  retry:
    base-delay: 100ms
    max-delay: 400ms
  poller:
    interval-ms: 100
    reaper-interval-ms: 300
