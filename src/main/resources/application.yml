spring:
  application:
    name: job-scheduler
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/scheduler}
    username: ${DB_USER:scheduler}
    password: ${DB_PASSWORD:scheduler}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Wait for all in-sync replicas and let the broker drop producer retries it has already seen.
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: job-workers
      auto-offset-reset: earliest
    listener:
      # Commit each offset after its record is processed.
      ack-mode: record

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

scheduler:
  default-tenant: default
  default-max-attempts: 3
  instance-id: ${HOSTNAME:local}
  outbox:
    enabled: true
    poll-interval-ms: 200
    batch-size: 100
  worker:
    enabled: true
    concurrency: 3
    lease-duration: 30s
